  <!-- Black Circle on Cup -->
  <circle cx="50" cy="54" r="8.5" fill="#0E0F12" />
  
  <!-- Green Sparkle Dots -->
  <circle cx="25" cy="20" r="2.2" fill="#3DFF8A" />
  <circle cx="78" cy="30" r="2.2" fill="#3DFF8A" />
  <circle cx="28" cy="88" r="1.8" fill="#3DFF8A" />
  <circle cx="72" cy="88" r="1.8" fill="#3DFF8A" />
  
